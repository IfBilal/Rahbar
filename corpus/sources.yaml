# RAHBAR corpus: public FAST-NUCES documents (nu.edu.pk), checked on 4 November 2026.
# Every URL below returned HTTP 200 on that date. Run:  python corpus/fetch.py
#
# doc_version and superseded become chunk metadata (case study 3.1). `superseded: true`
# marks the repealed edition of a policy; the API filters it out unless the question
# explicitly asks about an older version (3.2 step 4). Reports from different years are
# editions over time, not revisions of one policy, so they stay superseded: false.
# See docs/CORPUS.md for which document provides which of the seven required properties.

documents:

  # Property 2 (two versions of one policy) and 7 (exact clause numbers, CGPA thresholds).
  # The 2023 rules are the repealed edition; the Jun 2026 handbook replaced them.
  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true
    notes: Still linked from /Student/RulesUndergrad. Superseded by the Jun 2026 handbook.

  - name: Academic Rules Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Academic_Rules_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false
    notes: Numbered clauses; the current undergraduate academic rules.

  # Property 2 again, with different clause numbering for the same rules (exact-term trap).
  - name: Prospectus 2026 - Academic Rules and Regulations
    url: https://nu.edu.pk/Admissions/ProspectusUpload/Academic Rules and Regulations.pdf
    doc_version: "2026"
    superseded: false
    notes: The same rules in 5 pages with different clause numbers.

  # Property 5: long definitions (Generative AI policy with numbered sub-sections).
  - name: Student Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Student_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false

  # Property 4: tables (faculty by campus, graduates, publications); editions over time.
  - name: Annual Report 2019-20
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2019-20.pdf
    doc_version: "2019-20"
    superseded: false

  - name: Annual Report 2023-24
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2023-24.pdf
    doc_version: "2023-24"
    superseded: false

  # Property 4 and 7: HTML tables with fees and grade points.
  - name: Fee Structure page
    url: https://www.nu.edu.pk/Admissions/FeeStructure
    doc_version: "2026-27"
    superseded: false

  - name: Grading page
    url: https://www.nu.edu.pk/Student/Grading
    doc_version: "2026"
    superseded: false

  # Property 3: scanned, image-only PDF (pdffonts lists no fonts). Needs OCR.
  - name: Faculty Entrepreneurship and Technical Start-ups Policy
    url: https://nu.edu.pk/OricResources/ResearchPolicies/27.pdf?20220530
    doc_version: "2022-05"
    superseded: false

  # Property 6: the deliberately absent topic is hostel accommodation. The document that
  # covers it is left OUT on purpose, and eval/golden.yaml asks about it (must_abstain).
  # - name: Prospectus - Transport and Hostel Facilities
  #   url: https://nu.edu.pk/Admissions/ProspectusUpload/Transport and Hostel Facilities.pdf
