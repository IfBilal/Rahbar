# Images from Docker Hub, tagged by commit SHA, never :latest (section 6). cd.yml rewrites
# the repository and the three tags to docker.io/<DOCKERHUB_USERNAME>/...:${{ github.sha }}
# with `kustomize edit set image` before it deploys. The committed values are placeholders
# that only make the overlay render and pass kubeconform; no image was pushed under them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: rahbar-api, newName: docker.io/rahbar/rahbar-api, newTag: 8c0b87f1}
  - {name: rahbar-ui, newName: docker.io/rahbar/rahbar-ui, newTag: 8c0b87f1}
  - {name: rahbar-indexer, newName: docker.io/rahbar/rahbar-indexer, newTag: 8c0b87f1}
