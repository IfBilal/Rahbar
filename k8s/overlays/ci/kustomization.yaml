# The e2e-eval job: the whole stack on kind, indexing the three fixture documents baked
# into the indexer image (eval/fixtures) instead of fetching the real corpus, so the job
# takes minutes. Images are built in the workflow and loaded with `kind load`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/ephemeral-cluster
images:
  - {name: rahbar-api, newTag: ci}
  - {name: rahbar-ui, newTag: ci}
  - {name: rahbar-indexer, newTag: ci}
  - {name: rahbar-ragops, newTag: ci}
patches:
  - target: {kind: ConfigMap, name: rahbar-config}
    patch: |-
      - {op: replace, path: /data/CORPUS_DIR, value: /app/eval/fixtures}
  # The CI stack indexes the three fixture documents baked into the image instead of the real
  # corpus: one init container copies them into the inbox (no download, no seed catalog needed).
  - target: {kind: Job, name: ingest}
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers
        value:
          - name: fixtures-to-inbox
            image: rahbar-indexer
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "mkdir -p /data/inbox && cp /app/eval/fixtures/academic-rules-2023.md /app/eval/fixtures/academic-rules-2026.md /app/eval/fixtures/fees-2026.md /data/inbox/"]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
              - {name: data, mountPath: /data}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
  - target: {kind: CronJob, name: ingest}
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/initContainers
        value:
          - name: fixtures-to-inbox
            image: rahbar-indexer
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "mkdir -p /data/inbox && cp /app/eval/fixtures/academic-rules-2023.md /app/eval/fixtures/academic-rules-2026.md /app/eval/fixtures/fees-2026.md /data/inbox/"]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
              - {name: data, mountPath: /data}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
