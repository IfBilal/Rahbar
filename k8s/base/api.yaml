# The API: three read-only replicas (4.1). It never indexes; the indexer Job does (4.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
  labels: {app: api}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  # On a fresh cluster the pods are correctly unready until the indexer Job publishes
  # (4.2), which took 405-798 s here and longer on a CI runner. The 600 s default
  # marked that wait as a failed rollout (cd run 42057168112).
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}     # never below 3 ready pods (4.6)
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      # No CHROMA_PORT=tcp://... service links: Chroma reads CHROMA_* as its own config.
      enableServiceLinks: false
      # preStop sleeps 10 s so the endpoint is removed before uvicorn stops accepting
      # connections; then uvicorn finishes in-flight answers. A CPU generation takes up to
      # ~190 s here: with the old 30 s grace a rollout cut answers off with a 502 (measured).
      terminationGracePeriodSeconds: 240
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                  # the traces volume is writable by the non-root user
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: rahbar-api
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rahbar-config}
            - configMapRef: {name: ragops-config}                # trace and evaluation switches
            - secretRef: {name: rahbar-secret, optional: true}   # LLM_API_KEY, hosted mode only
          env:
            - {name: HOME, value: /tmp}
            # RELEASE-SCOPED values live in the pod template on purpose (A3 F3): a rollout creates a
            # new ReplicaSet with new values and `kubectl rollout undo` restores the old ones. A key
            # left in a shared ConfigMap would survive an undo. They override envFrom, and
            # tests/test_manifests.py checks they agree with rahbar-config for the ingest Job.
            - {name: RELEASE_ID, value: "R1-nomic"}
            - {name: CHROMA_COLLECTION, value: "rahbar"}
            - {name: EMBED_MODEL, value: "nomic-embed-text"}
            - {name: EMBED_VERSION, value: "0a109f422b47"}       # ollama digest, docs/a3-evidence/embed-versions.txt
            - {name: RELEVANCE_FLOOR, value: "0.60"}
            - {name: TOP_K, value: "5"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          startupProbe:          # finished booting? liveness and readiness wait for it
            httpGet: {path: /healthz, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:         # process alive? touches no dependency (4.3)
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:        # Chroma + non-empty collection + embedding pin + Redis
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "10"]}
          resources:
            # kubectl top (docs/evidence/hpa.txt, 585 samples): 3m / ~70Mi serving, peaks
            # 151m (startup) and 74Mi. The CPU request is also the HPA's denominator.
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: traces, mountPath: /traces}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: traces
          persistentVolumeClaim: {claimName: ragops-traces}
