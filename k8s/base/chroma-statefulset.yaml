# Chroma is a StatefulSet, not a Deployment (ARCHITECTURE.md): its identity and its volume
# belong together. volumeClaimTemplates gives chroma-0 a PVC that survives pod deletion and
# re-attaches to the replacement pod; one replica, because the index has one writer.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels: {app: chroma}
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels: {app: chroma}
  template:
    metadata:
      labels: {app: chroma}
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      # No CHROMA_PORT=tcp://... service links: Chroma reads CHROMA_* as its own config.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12          # same version as chromadb-client==1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            # kubectl top: 2m / 32Mi for 532 vectors; the limit leaves room for HNSW growth
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
