# Apply order is handled by kubectl (Namespace first). secret.placeholder.yaml is
# deliberately NOT listed: applying it would overwrite the real Secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
labels:
  - pairs: {app.kubernetes.io/part-of: rahbar}
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - services.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - hpa.yaml
