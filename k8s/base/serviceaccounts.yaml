# One ServiceAccount per workload (4.7). None of them calls the Kubernetes API, so no
# token is mounted anywhere: a compromised pod gets no cluster credentials.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis, namespace: rahbar}
automountServiceAccountToken: false
