# The SHAPE of the Secret, with placeholders only. It is NOT listed in kustomization.yaml:
# applying it would overwrite the real Secret. Create the real one from the command line:
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
# (or `make secret`). Base64 is encoding, not encryption: real values never go in Git.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
