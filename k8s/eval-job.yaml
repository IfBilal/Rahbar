# The offline test suite as a Job (A3 F2): runs the Part B suite against TARGET_URL, writes a
# timestamped result file to the ragops-results volume, applies the release gate and EXITS WITH THE
# GATE'S CODE, so a failing gate is a Failed Job.
#   kubectl delete job eval -n rahbar --ignore-not-found; kubectl apply -f k8s/eval-job.yaml
#   kubectl wait --for=condition=failed job/eval -n rahbar     # when the gate fails
# What it tests and how comes from the ConfigMap ragops-eval-target; the thresholds come from the
# ConfigMap ragops-gate, read when the pod starts: edit the ConfigMap, re-run the Job, no rebuild.
apiVersion: batch/v1
kind: Job
metadata:
  name: eval
  namespace: rahbar
  labels: {app: ragops-eval}
spec:
  backoffLimit: 0                    # a failing gate must stay failed, not retry into a pass
  activeDeadlineSeconds: 21600       # the longest measured suite run plus margin (docs/a3-evidence)
  template:
    metadata:
      labels: {app: ragops-eval}
    spec:
      restartPolicy: Never
      serviceAccountName: ragops-eval
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: eval
          image: rahbar-ragops:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/job_entry.sh"]
          envFrom:
            - configMapRef: {name: ragops-eval-target}
          env:
            - {name: HOME, value: /tmp}
            - name: OLLAMA_URL
              valueFrom: {configMapKeyRef: {name: rahbar-config, key: OLLAMA_URL}}
            - {name: GATE_CONFIG, value: /config/gate.yaml}
            - {name: RESULTS_DIR, value: /results}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: gate, mountPath: /config, readOnly: true}
            - {name: results, mountPath: /results}
            - {name: data, mountPath: /data, readOnly: true}
            - {name: traces, mountPath: /traces, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: gate
          configMap: {name: ragops-gate}
        - name: results
          persistentVolumeClaim: {claimName: ragops-results}
        - name: data
          persistentVolumeClaim: {claimName: ragops-data, readOnly: true}
        - name: traces
          persistentVolumeClaim: {claimName: ragops-traces, readOnly: true}
        - name: tmp
          emptyDir: {}
