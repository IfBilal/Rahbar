# Bonus: ollama-incluster mode. Add to an overlay with
#   components: [../../components/ollama-incluster]
# It adds the Ollama Deployment, PVC, Service and policy; points the API and the indexer
# at http://ollama:11434; and lets them reach the ollama pods instead of the host IP.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ollama.yaml
patches:
  - target: {kind: ConfigMap, name: rahbar-config}
    patch: |-
      - {op: replace, path: /data/OLLAMA_URL, value: "http://ollama:11434"}
      - {op: replace, path: /data/LLM_PROVIDER, value: "ollama-incluster"}
  - target: {kind: NetworkPolicy, name: api-policy}
    patch: |-
      - {op: test, path: /spec/egress/2/ports/0/port, value: 11434}
      - {op: replace, path: /spec/egress/2/to/0, value: {podSelector: {matchLabels: {app: ollama}}}}
  - target: {kind: NetworkPolicy, name: indexer-policy}
    patch: |-
      - {op: test, path: /spec/egress/1/ports/0/port, value: 11434}
      - {op: replace, path: /spec/egress/1/to/0, value: {podSelector: {matchLabels: {app: ollama}}}}
